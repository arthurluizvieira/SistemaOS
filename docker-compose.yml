version: "3.9"

services:
  backend:
    build: ./backend
    container_name: qordem-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=qordem
      - DB_USER=root
      - DB_PASSWORD=senha123

  db:
    image: mysql:8
    container_name: qordem-db
    restart: always
    environment:
      MYSQL_DATABASE: qordem
      MYSQL_ROOT_PASSWORD: senha123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    container_name: qordem-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
